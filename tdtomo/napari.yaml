name: tdtomo
contributions:
  commands:
    - id: tdtomo.run
      title: Run
      python_name: tdtomo.main:build_gui
    - id: tdtomo.phantom
      title: Phantom
      python_name: tdtomo.phantoms:build_phantom_menu
    - id: tdtomo.read_volume
      title: Read Volume  
      python_name: tdtomo.io.readers:read_volume
    - id: tdtomo.read_sinogram
      title: Read Volume  
      python_name: tdtomo.io.readers:read_sinogram

  widgets:
    - command: tdtomo.run
      display_name: "Run"

  sample_data:
    - key: phantom
      command: tdtomo.phantom
      display_name: Phantoms…

  readers:
    - command: tdtomo.read_volume
      filename_patterns:
        - "*.rec"

    - command: tdtomo.read_sinogram
      filename_patterns:
        - "*.mrc"
